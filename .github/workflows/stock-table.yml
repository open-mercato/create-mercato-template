name: Stock table

# Fails when npm has a stable create-mercato-app version that
# src/stock/table.json lacks (spec, Q14). It never runs on pull requests, so an
# Open Mercato release does not fail every PR. When it fails, a maintainer runs
# `npm run stock-table`, commits the table and releases a patch. No automatic PR.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # Runs only `npm view create-mercato-app versions --json`; the script
      # needs no installed dependencies.
      - run: npm run stock-table -- --check
